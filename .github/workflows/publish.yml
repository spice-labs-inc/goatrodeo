name: Publish package to Maven Central, Github Packages, and Container Image to Docker Hub

on:
  release:
    types: [published]

env:
  IMAGE_NAME: ${{ github.repository }}
  DOCKERHUB_NAMESPACE: ${{ secrets.DOCKER_USERNAME }}
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  publish-jars:
    name: Publish JARs to GitHub (Maven Central temporarily disabled)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      successor-ok: ${{ steps.version.outputs.successor_ok }}
      auto-publish: ${{ steps.version.outputs.auto_publish }}
      previous: ${{ steps.version.outputs.previous }}
      expected: ${{ steps.version.outputs.expected }}
      thread-ts: ${{ steps.release-notification.outputs.thread-ts }}
      channel-id: ${{ steps.release-notification.outputs.channel_id }}

    steps:
      - name: Notify release
        id: release-notification
        uses: spice-labs-inc/action-release-notification@v3.3
        with:
          type: release
          slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          username-mapping: ${{ vars.GH_SLACK_USERNAME_MAPPING }}
          github-token: ${{ github.token }}

      - name: Checkout with LFS
        uses: actions/checkout@v5
        with:
          lfs: true
          # Full history and tags: the successor check compares this release
          # tag against every previously released version.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "sbt"

      - name: Set up SBT
        uses: sbt/setup-sbt@v1

      - name: Validate the release tag
        id: version
        shell: bash
        env:
          # tag_name is "vX.Y.Z" (no refs/tags/ prefix) for the release event.
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          git tag --list > /tmp/all-tags.txt
          python3 .github/scripts/check-release-tag.py \
            "${TAG_NAME}" /tmp/all-tags.txt > /tmp/tag-check.out
          cat /tmp/tag-check.out >> "$GITHUB_OUTPUT"
          # sbt reads the version from the environment further down.
          echo "projectVersion=$(sed -n 's/^version=//p' /tmp/tag-check.out)" >> "$GITHUB_ENV"

      - name: Publish standard and fat JARs to GitHub Packages
        run: |
          SBT_OPTS="-Xmx8G -Duser.timezone=GMT" sbt \
            "set ThisBuild / version := \"${{ env.projectVersion }}\"" \
            +publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_TARGET: github

      - name: Index and Upload ADG
        uses: spice-labs-inc/action-spice-labs-surveyor@v5
        with:
          spice_pass: "${{ secrets.SPICE_PASS }}"
          input: "${{ github.workspace }}"
          subject: "${{ github.event.repository.name }}"
          cli_image_tag: "1.6.3"

  publish-to-central:
    name: Re-publish Goatrodeo to Maven Central
    runs-on: ubuntu-24.04
    needs: publish-jars
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Write settings.xml for Central
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>central</id>
                <username>${{ secrets.MAVEN_CENTRAL_USERNAME }}</username>
                <password>${{ secrets.MAVEN_CENTRAL_PASSWORD }}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Import GPG key
        run: |
          echo "${{ secrets.MAVEN_CENTRAL_GPG_PRIVATE_KEY }}" | gpg --batch --import

      - name: Set project version from tag
        run: |
          mvn -B --file maven/pom.xml \
              clean versions:set -DnewVersion="${{ needs.publish-jars.outputs.version }}" -DgenerateBackupPoms=false

      - name: Create target dir
        run: mkdir -p maven/target/external

      - name: Download artifacts from GitHub Maven
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.publish-jars.outputs.version }}
        run: |
          ARTIFACTS=(
            "goatrodeo_3-${VERSION}.jar"
            "goatrodeo_3-${VERSION}-sources.jar"
            "goatrodeo_3-${VERSION}-javadoc.jar"
            "goatrodeo_3-${VERSION}.pom"
            "goatrodeo_3-${VERSION}-fat.jar"
          )
          for file in "${ARTIFACTS[@]}"; do
            echo "Downloading $file"
            curl -fL -o "maven/target/external/$file" \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/octet-stream" \
              "https://maven.pkg.github.com/spice-labs-inc/goatrodeo/io/spicelabs/goatrodeo_3/${VERSION}/${file}"
          done

      - name: Inject real dependencies block into fake pom.xml
        run: |
          set -e

          VERSION="${{ needs.publish-jars.outputs.version }}"
          REAL_POM="maven/target/external/goatrodeo_3-${VERSION}.pom"
          FAKE_POM="maven/pom.xml"
          real_deps=$(
            awk '/<dependencyManagement>/,/<\/dependencyManagement>/ {next}
                 /<dependencies>/,/<\/dependencies>/' "$REAL_POM"
          )
          real_props=$(
            awk '/<profiles>/,/<\/profiles>/ {next}
                 /<properties>/,/<\/properties>/' "$REAL_POM"
          )
          awk -v deps="$real_deps" -v props="$real_props" '
            /<!-- @REAL_DEPENDENCIES@ -->/ {print deps; next}
            /<!-- @REAL_PROPERTIES@ -->/ {print props; next}
            {print}
          ' "$FAKE_POM" > "${FAKE_POM}.tmp" && mv "${FAKE_POM}.tmp" "$FAKE_POM"

      - name: Publish to Maven Central
        run: |
          cd maven
          mvn --batch-mode deploy \
            -Dcentral.autoPublish=${{ needs.publish-jars.outputs.auto-publish }}
        env:
          GPG_PASSPHRASE: ${{ secrets.MAVEN_CENTRAL_GPG_PASSPHRASE }}

  docker-image:
    name: Build and Push Docker Image
    runs-on: ubuntu-24.04
    needs: publish-jars
    permissions:
      contents: read
      attestations: write
      id-token: write

    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: ${{ env.PLATFORMS }}

      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Fat JAR from GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fL -o goatrodeo-fat.jar \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/octet-stream" \
            "https://maven.pkg.github.com/spice-labs-inc/goatrodeo/io/spicelabs/goatrodeo_3/${{ needs.publish-jars.outputs.version }}/goatrodeo_3-${{ needs.publish-jars.outputs.version }}-fat.jar"

      - name: Extract Metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: spicelabs/goatrodeo
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          flavor: |
            latest=auto

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Create image export directory
        run: mkdir -p target/release

      - name: Build and Push Docker Image (and export locally)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Save a local copy of the built image under target/release/
          outputs: type=oci,dest=target/release/goatrodeo-image.tar

      - name: Index and Upload ADG
        uses: spice-labs-inc/action-spice-labs-surveyor@v5
        with:
          spice_pass: "${{ secrets.SPICE_PASS }}"
          input: "${{ github.workspace }}"
          subject: "${{ github.event.repository.name }}"
          cli_image_tag: "1.6.3"

  # Its own job rather than a step inside publish-jars: failing there would block
  # publish-to-central and docker-image, and the point is for the Central
  # deployment to happen and then wait. This job exists to turn the run red --
  # `mvn deploy` succeeds even when the deployment is only staged, so without it
  # the run would go green with nothing published on Maven Central.
  confirm-central-release:
    name: Maven Central release awaiting confirmation
    needs: [publish-jars, publish-to-central]
    if: always() && needs.publish-jars.outputs.successor-ok == 'false'
    runs-on: ubuntu-24.04
    steps:
      - name: Flag release awaiting manual confirmation
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
          PREVIOUS: ${{ needs.publish-jars.outputs.previous }}
          EXPECTED: ${{ needs.publish-jars.outputs.expected }}
        run: |
          {
            echo "## :warning: Maven Central release awaiting manual confirmation"
            echo
            if [ -n "${PREVIOUS}" ]; then
              echo "\`${TAG_NAME}\` is not a natural successor to \`${PREVIOUS}\`."
              echo "Expected one of: ${EXPECTED}."
            else
              echo "\`${TAG_NAME}\` is lower than every existing release."
            fi
            echo
            echo "The deployment was uploaded and validated, but **has not been published**."
            echo "It is waiting in the [Central Portal](https://central.sonatype.com/publishing/deployments):"
            echo
            echo "- **Publish** it if this version number is deliberate."
            echo "- **Drop** it otherwise, then delete the \`${TAG_NAME}\` release and tag and cut the correct version."
            echo
            echo "GitHub Packages and the Docker image already carry \`${TAG_NAME}\`; clean those up too if you drop this."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Maven Central release awaiting confirmation::${TAG_NAME} was not published automatically${PREVIOUS:+ (does not follow ${PREVIOUS})}. The deployment is parked in the Central Portal and must be published or dropped by hand."
          exit 1

  notify:
    needs: [publish-jars, publish-to-central, docker-image, confirm-central-release]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check deployment status
        id: deployment-status
        shell: bash
        run: |
          # Check job outcomes
          JARS_STATUS="${{ needs.publish-jars.result }}"
          CENTRAL_STATUS="${{ needs.publish-to-central.result }}"
          DOCKER_STATUS="${{ needs.docker-image.result }}"
          SUCCESSOR_OK="${{ needs.publish-jars.outputs.successor-ok }}"

          # Staged, not failed: the artifacts are uploaded and validated but
          # parked in the Central Portal pending a human decision. Reported as a
          # failure because nothing is on Maven Central yet, but named distinctly
          # so it is not mistaken for a broken build.
          if [ "$SUCCESSOR_OK" == "false" ]; then
            echo "overall_status=failure" >> $GITHUB_OUTPUT
            echo "message=⚠️ Awaiting manual confirmation in the Maven Central Portal." >> $GITHUB_OUTPUT
            echo "workflow_name=${{ github.workflow }} — AWAITING MANUAL CONFIRMATION in the Maven Central Portal" >> $GITHUB_OUTPUT
          elif [ "$JARS_STATUS" == "success" ] && [ "$CENTRAL_STATUS" == "success" ] && [ "$DOCKER_STATUS" == "success" ]; then
            echo "overall_status=success" >> $GITHUB_OUTPUT
            echo "message=✅ All components published successfully!" >> $GITHUB_OUTPUT
            echo "workflow_name=${{ github.workflow }}" >> $GITHUB_OUTPUT
          else
            echo "overall_status=failure" >> $GITHUB_OUTPUT

            # Build detailed failure message
            MESSAGE="❌ Publishing failed:"
            if [ "$JARS_STATUS" != "success" ]; then
              MESSAGE="$MESSAGE ❌ SBT JAR publishing failed."
            else
              MESSAGE="$MESSAGE ✅ SBT JAR publishing succeeded."
            fi

            if [ "$CENTRAL_STATUS" != "success" ]; then
              MESSAGE="$MESSAGE ❌ Maven Central publishing failed."
            else
              MESSAGE="$MESSAGE ✅ Maven Central publishing succeeded."
            fi

            if [ "$DOCKER_STATUS" != "success" ]; then
              MESSAGE="$MESSAGE ❌ Docker build/push failed."
            else
              MESSAGE="$MESSAGE ✅ Docker build/push succeeded."
            fi

            echo "message=$MESSAGE" >> $GITHUB_OUTPUT
            echo "workflow_name=${{ github.workflow }}" >> $GITHUB_OUTPUT
          fi

      - name: Notify deployment result
        uses: spice-labs-inc/action-release-notification@v3.3
        with:
          type: ${{ steps.deployment-status.outputs.overall_status == 'success' && 'deployment-success' || 'deployment-failure' }}
          slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          username-mapping: ${{ vars.GH_SLACK_USERNAME_MAPPING }}
          github-token: ${{ github.token }}
          workflow-name: ${{ steps.deployment-status.outputs.workflow_name }}
          environment: production
          thread-ts: ${{ needs.publish-jars.outputs.thread-ts }}
          channel-id: ${{ needs.publish-jars.outputs.channel-id }}
