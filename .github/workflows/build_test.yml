# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Scala Build & Test

on:
  push:
    branches: [ "**" ]

permissions:
  contents: read
  packages: read

jobs:
  build:

    runs-on: ubuntu-24.04

    steps:
    - name: Checkout with LFS
      uses: actions/checkout@v5
      with:
        lfs: true
    - name: Free up disk space on the runner
      # ADGTests downloads repo_ea.tgz (~5.2 GiB) and untars it (~5.2 GiB)
      # into test_data/download/adg_tests/. On ubuntu-24.04 the default
      # ~14 GiB of free space is just barely enough; if the runner has
      # any other consumers (Docker, browser stacks, etc.) the untar
      # silently truncates and ADGTests later fails with missing-JAR
      # errors. Reclaim the chunky pre-installed toolchains we don't use
      # before the test data is materialised.
      run: |
        df -h /
        sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
        sudo docker image prune --all --force || true
        df -h /
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'sbt'
    - name: Set up sbt
      uses: sbt/setup-sbt@v1
    - name: Run tests
      run: SBT_OPTS="-Xmx8G -Duser.timezone=GMT" TEST_THREAD_CNT="4" sbt test
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # OSV dependency gate — independent of the build/test job (spec §2):
  # derives the query body from the resolved dependency set, queries
  # api.osv.dev, and fails on concrete CVSS >= 7.0; fail-open on unscored
  # advisories (user decision 2026-09-02). Everything runs inside the sbt
  # task `osvCheck` (no Python, no shell scripts; fixtures and the gate
  # are sbt-native per project rule).
  osv:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout
      uses: actions/checkout@v5
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'sbt'
    - name: Set up sbt
      uses: sbt/setup-sbt@v1
    - name: OSV gate (fail-open, sbt-native)
      run: sbt osvCheck
